# Copy this file to povforge.toml (in the folder you run povforge from) and
# change what you need. Everything is optional; these are the defaults.

[output]
dir = "povforge-output"          # one sub-folder per demo + player

[plan]
pre_roll_seconds = 3.0           # start this long before freeze time ends
post_death_seconds = 2.0         # keep recording this long after the player dies
post_round_seconds = 2.0         # ...or after the round is decided
min_segment_seconds = 1.0        # skip clips shorter than this

[record]                         # recording in CS2 through HLAE
hlae_path = ""                   # empty = C:\Tools\hlae\HLAE.exe and other usual places
cs2_path = ""                    # empty = found through Steam
width = 1920
height = 1080
fps = 60
window_mode = "windowed"         # or "fullscreen" if your screen is smaller than width x height
video_options = "-c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 16"
preroll_seconds = 2.0            # wait this long at each clip start before recording
spec_mode = ""                   # only if a CS2 update needs it
game_hud = "full"                # full: keep CS2's own HUD (demo bar and game radar are hidden)
                                 # killfeed: game shows only the kill feed, povforge draws a HUD
extra_setup = ""                 # extra console commands, e.g. "cl_hud_color 3; safezonex 0.9"
timeout_factor = 3.0

[overlay]
minimap = true
minimap_size = 360               # pixels at 1080p (scaled for other heights)
show_enemies = false             # true = enemies on the minimap too
keyboard = true
keyboard_scale = 1.0
sync_offset_frames = 0.0         # nudge overlays if they lead/lag the video
place_label = false              # location name under the minimap
utility = true                   # grenade paths, smokes and fires with countdowns on the minimap
player_bar = true                # with game_hud = "full": cover the spectator panel at the bottom with a
                                 # player-style bar (health, armor, team, ammo, a skull per kill this round)
# hud / crosshair / scope are only drawn with game_hud = "killfeed":
hud = true                       # health, armor, money, ammo
crosshair = true
scope = true                     # sniper scope while scoped in

[compose]
minimap_anchor = "top-left"      # top-left, top-center, top-right, left-center, right-center,
minimap_margin = 24              # bottom-left, bottom-center, bottom-right, center
keyboard_anchor = "bottom-center"
keyboard_margin = 185            # distance from the bottom, in pixels at 1080p (above the game HUD)
crf = 18                         # x264 quality: lower = better and bigger
preset = "veryfast"              # x264 speed; slower presets = smaller files
ffmpeg = "ffmpeg"

[intro]
enabled = true
seconds = 4.0
title = "{player} POV"           # placeholders: {player} {map} {date} {width} {height}
subtitle = "{map}  ·  {date}  ·  {width}x{height}"
date = ""                        # empty = FACEIT match start time (else the demo file date)
date_format = "%Y年%m月%d日 %H:%M"   # e.g. "%Y-%m-%d %H:%M"
timezone = ""                    # e.g. "Asia/Shanghai"; empty = this PC's time zone
image = "auto"                   # "auto": FACEIT demos get a screenshot of the match room, taken
                                 # automatically (needs Edge or Chrome); other demos get the
                                 # scoreboard card. "" = always the scoreboard card;
                                 # "latest" = your newest screenshot; or an image file path
show_browser = false             # true = show the browser window while taking the screenshot
