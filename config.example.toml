# Copy this file to povforge.toml (in the folder you run povforge from) and
# change what you need. Everything is optional; these are the defaults.

[output]
dir = "povforge-output"          # one sub-folder per demo + player

[plan]
pre_roll_seconds = 0.0           # start this long before freeze time ends
post_death_seconds = 2.0         # keep recording this long after the player dies
post_round_seconds = 2.0         # ...or after the round is decided
min_segment_seconds = 1.0        # skip clips shorter than this

[record]                         # recording in CS2 through HLAE
hlae_path = ""                   # empty = C:\Tools\hlae\HLAE.exe and other usual places
cs2_path = ""                    # empty = found through Steam
width = 1920
height = 1080
fps = 60
window_mode = "windowed"         # or "fullscreen" if your screen is smaller than width x height
video_options = "-c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 16"
preroll_seconds = 2.0            # wait this long at each clip start before recording
spec_mode = ""                   # only if a CS2 update needs it
extra_setup = ""                 # extra console commands, e.g. "cl_hud_color 3; safezonex 0.9"
timeout_factor = 3.0

[overlay]
minimap = true
minimap_size = 360               # pixels at 1080p (scaled for other heights)
show_enemies = false             # true = enemies on the minimap too
keyboard = true
keyboard_scale = 1.0
sync_offset_frames = 0.0         # nudge overlays if they lead/lag the video

[compose]
minimap_anchor = "top-left"      # top-left, top-center, top-right,
keyboard_anchor = "left-center"  # left-center, right-center,
                                 # bottom-left, bottom-center, bottom-right
margin = 24
crf = 18                         # x264 quality: lower = better and bigger
preset = "medium"
ffmpeg = "ffmpeg"
