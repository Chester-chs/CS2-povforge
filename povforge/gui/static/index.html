<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PovForge</title>
<link rel="icon" href="/static/icon.png">
<!-- Basecoat (shadcn/ui design system in plain CSS, MIT) + our layout on top -->
<link rel="stylesheet" href="/static/vendor/basecoat.min.css">
<link rel="stylesheet" href="/static/app.css">
<script defer src="/static/app.js"></script>
<script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body x-data="povforge" x-init="boot()">
<div id="icons"></div>

<!-- ================= sidebar ================= -->
<aside class="side">
  <header class="brand">
    <img src="/static/icon.png" alt="">
    <div>
      <b>PovForge</b>
      <span x-text="'v' + version"></span>
    </div>
  </header>

  <section class="side-sec grow">
    <div class="side-head">
      <h2 x-text="t('demos')"></h2>
      <button class="btn" data-variant="ghost" data-size="icon-sm" @click="loadDemos()" :title="t('refresh')"><svg><use href="#i-refresh-cw"/></svg></button>
    </div>
    <p class="side-note" x-text="t('lookingIn') + ' ' + shortPath(prefs.demo_folders?.[0] || '')"></p>
    <div class="demo-list" role="listbox" :aria-label="t('demos')">
      <template x-for="d in demos" :key="d.path">
        <button class="demo" role="option" :aria-selected="!!(demo && demo.path === d.path)" @click="pickDemo(d.path)">
          <span class="demo-top">
            <b x-text="d.map || niceDemoName(d)"></b>
            <span class="demo-score" x-show="d.score" x-text="d.score"></span>
            <span class="badge" data-variant="outline" x-show="d.faceit">FACEIT</span>
          </span>
          <span class="demo-meta">
            <span class="demo-file" x-show="d.map" x-text="niceDemoName(d)"></span>
            <span x-text="ago(d.mtime)"></span>
            <span x-text="mb(d.size)"></span>
          </span>
        </button>
      </template>
      <p class="side-empty" x-show="demosLoaded && !demos.length" x-text="t('noDemos')"></p>
    </div>
    <div class="side-actions">
      <button class="btn" data-variant="outline" data-size="sm" @click="browse()"><svg><use href="#i-folder-open"/></svg><span x-text="t('openFile')"></span></button>
      <button class="btn" data-variant="ghost" data-size="sm" @click="chooseFolder('demos')"><svg><use href="#i-folder"/></svg><span x-text="t('demoFolder')"></span></button>
    </div>
  </section>

  <section class="side-sec queue" x-show="queue.items.length" x-cloak>
    <div class="side-head">
      <h2><span x-text="t('queueTitle')"></span> <span class="count" x-text="queue.items.length"></span></h2>
      <button class="btn" data-variant="link" data-size="xs" x-show="queue.items.some(i => ['done', 'error', 'cancelled'].includes(i.state))"
              @click="clearQueue()" x-text="t('clearDone')"></button>
    </div>
    <ul class="q-list">
      <template x-for="it in queue.items" :key="it.id">
        <li class="q-item" :class="[it.state, { on: showRun && (viewId === it.id || (!viewId && job.item === it.id)) }]">
          <span class="q-ic">
            <svg class="spin" x-show="it.state === 'running'"><use href="#i-loader-circle"/></svg>
            <svg x-show="it.state === 'queued'"><use href="#i-clock"/></svg>
            <svg x-show="it.state === 'done'"><use href="#i-circle-check"/></svg>
            <svg x-show="it.state === 'error'"><use href="#i-circle-x"/></svg>
            <svg x-show="it.state === 'cancelled'"><use href="#i-square"/></svg>
          </span>
          <button class="q-main" @click="openItem(it)">
            <b x-text="it.name"></b>
            <span x-text="[it.map, it.rounds.length ? t('nRounds', { n: it.rounds.length }) : t('wholeMatch'), t('st_' + it.state)].filter(Boolean).join(' · ')"></span>
          </button>
          <span class="q-act">
            <button class="btn" data-variant="ghost" data-size="icon-xs" x-show="it.state === 'done'" @click="openPath(it.result)" :title="t('play')"><svg><use href="#i-play"/></svg></button>
            <button class="btn" data-variant="ghost" data-size="icon-xs" x-show="it.state === 'error' || it.state === 'cancelled'" @click="retryItem(it.id)" :title="t('retry')"><svg><use href="#i-refresh-cw"/></svg></button>
            <button class="btn" data-variant="ghost" data-size="icon-xs" x-show="it.state !== 'running'" @click="removeItem(it.id)" :title="t('remove')"><svg><use href="#i-x"/></svg></button>
          </span>
        </li>
      </template>
    </ul>
    <button class="btn" data-size="sm" x-show="queue.paused && queue.items.some(i => i.state === 'queued')" @click="resumeQueue()">
      <svg><use href="#i-play"/></svg><span x-text="t('resume')"></span>
    </button>
  </section>

  <section class="side-sec env">
    <div class="side-head"><h2 x-text="t('setup')"></h2>
      <span class="badge" :data-variant="ready ? 'secondary' : 'destructive'" x-text="ready ? t('readyAll') : t('notReady')"></span>
    </div>
    <ul class="env-list">
      <li :class="setup.cs2 ? 'ok' : 'bad'" :title="setup.cs2"><i></i><span>CS2</span><em x-text="setup.cs2 ? t('found') : t('cs2Missing')"></em></li>
      <li :class="setup.hlae ? 'ok' : 'bad'" :title="setup.hlae"><i></i><span>HLAE</span><em x-text="setup.hlae ? t('found') : t('notInstalled')"></em></li>
      <li :class="setup.ffmpeg ? 'ok' : 'bad'" :title="setup.ffmpeg"><i></i><span>FFmpeg</span><em x-text="setup.ffmpeg ? t('found') : t('notInstalled')"></em></li>
      <li :class="setup.anticheat?.length ? 'bad' : 'ok'"><i></i><span x-text="t('antiCheat')"></span><em x-text="setup.anticheat?.length ? setup.anticheat.join(', ') + ' ' + t('running') : t('closed')"></em></li>
    </ul>
    <button class="btn" data-variant="secondary" data-size="sm" x-show="(!setup.hlae || !setup.ffmpeg) && !setup.installing" @click="install()">
      <svg><use href="#i-hard-drive-download"/></svg><span x-text="t('installTools')"></span>
    </button>
    <div class="install" x-show="setup.installing">
      <span x-text="setup.message || t('preparing')"></span>
      <div class="progress" role="progressbar" :aria-valuenow="Math.max(0, Math.round(setup.fraction * 100))" aria-valuemin="0" aria-valuemax="100">
        <span :style="'width:' + (setup.fraction >= 0 ? Math.round(setup.fraction * 100) : 35) + '%'"></span>
      </div>
    </div>
    <p class="err-note" x-show="setup.install_error" x-text="setup.install_error"></p>
    <p class="err-note" x-show="setup.settings_pending">
      <span x-text="t('settingsPending')"></span>
      <button class="btn" data-variant="link" data-size="xs" @click="restoreSettings()" x-text="t('restoreNow')"></button>
    </p>
  </section>

  <footer class="side-foot">
    <button class="btn update" data-variant="outline" data-size="sm" x-show="update" x-cloak @click="openUrl(update.url)">
      <svg><use href="#i-sparkles"/></svg><span x-text="t('updateAvail', { v: update?.version })"></span>
    </button>
    <div class="foot-row">
      <span><svg><use href="#i-shield-check"/></svg><span x-text="t('safeNote')"></span></span>
      <button class="btn" data-variant="ghost" data-size="xs" @click="toggleLang()" x-text="lang === 'zh' ? 'EN' : '中文'"></button>
    </div>
  </footer>
</aside>

<!-- ================= main ================= -->
<main class="main">

  <!-- first run / nothing picked -->
  <section class="page welcome" x-show="!demo && !inspecting && !inspectError && !runVisible">
    <header class="page-head">
      <h1 x-text="ready ? t('blankTitle') : t('setupTitle')"></h1>
      <p x-text="ready ? t('blankBody') : t('setupBody')"></p>
    </header>
    <div class="steps">
      <article class="step" :class="setup.cs2 ? 'ok' : 'todo'">
        <span class="step-ic"><svg x-show="setup.cs2"><use href="#i-check"/></svg><b x-show="!setup.cs2">1</b></span>
        <div><h3 x-text="t('ckCs2')"></h3><p x-text="setup.cs2 ? setup.cs2 : t('ckCs2Help')"></p></div>
      </article>
      <article class="step" :class="setup.hlae && setup.ffmpeg ? 'ok' : 'todo'">
        <span class="step-ic"><svg x-show="setup.hlae && setup.ffmpeg"><use href="#i-check"/></svg><b x-show="!(setup.hlae && setup.ffmpeg)">2</b></span>
        <div>
          <h3 x-text="t('ckTools')"></h3>
          <p x-text="setup.hlae && setup.ffmpeg ? t('ckToolsDone') : t('ckToolsHelp')"></p>
          <button class="btn" x-show="!(setup.hlae && setup.ffmpeg) && !setup.installing" @click="install()">
            <svg><use href="#i-hard-drive-download"/></svg><span x-text="t('installTools')"></span>
          </button>
          <div class="install" x-show="setup.installing">
            <span x-text="setup.message || t('preparing')"></span>
            <div class="progress" role="progressbar"><span :style="'width:' + (setup.fraction >= 0 ? Math.round(setup.fraction * 100) : 35) + '%'"></span></div>
          </div>
        </div>
      </article>
      <article class="step" :class="setup.anticheat?.length ? 'todo' : 'ok'">
        <span class="step-ic"><svg x-show="!setup.anticheat?.length"><use href="#i-check"/></svg><b x-show="setup.anticheat?.length">3</b></span>
        <div><h3 x-text="t('ckAc')"></h3><p x-text="setup.anticheat?.length ? t('needAntiCheat', { list: setup.anticheat.join(', ') }) : t('ckAcDone')"></p></div>
      </article>
      <article class="step" :class="demos.length ? 'ok' : 'todo'">
        <span class="step-ic"><svg x-show="demos.length"><use href="#i-check"/></svg><b x-show="!demos.length">4</b></span>
        <div><h3 x-text="t('ckDemo')"></h3><p x-text="demos.length ? t('ckDemoDone', { n: demos.length }) : t('ckDemoHelp')"></p></div>
      </article>
    </div>
    <p class="err-note" x-show="setup.problems?.length" x-text="(setup.problems || []).join(' · ')"></p>
  </section>

  <section class="page center" x-show="inspecting && !runVisible">
    <section class="empty">
      <figure><svg class="spin"><use href="#i-loader-circle"/></svg></figure>
      <h3 x-text="t('reading')"></h3>
      <p x-text="t('readingBody')"></p>
    </section>
  </section>

  <section class="page center" x-show="inspectError && !inspecting && !runVisible">
    <section class="empty">
      <figure class="bad"><svg><use href="#i-circle-alert"/></svg></figure>
      <h3 x-text="t('cantRead')"></h3>
      <p x-text="inspectError"></p>
    </section>
  </section>

  <!-- match: pick a player and rounds -->
  <section class="page match" x-show="demo && !inspecting && !runVisible">
    <header class="hero">
      <template x-if="demo"><img class="radar" :src="'/api/radar?map=' + demo.map" alt="" x-on:error="$el.remove()"></template>
      <div class="hero-text">
        <div class="hero-badges">
          <span class="badge" data-variant="secondary" x-text="demo?.rounds + ' ' + t('rounds')"></span>
          <span class="badge" data-variant="secondary" x-text="Math.round(demo?.minutes || 0) + ' ' + t('minDemo')"></span>
          <span class="badge" data-variant="outline" x-show="demo?.faceit_match">FACEIT</span>
        </div>
        <h1 x-text="demo?.map_pretty"></h1>
        <div class="score" x-show="demo?.teams?.length >= 2">
          <span class="tn" x-text="demo?.teams[0].name"></span>
          <b :class="{ win: demo?.teams[0].score > demo?.teams[1].score }" x-text="demo?.teams[0].score"></b>
          <i>:</i>
          <b :class="{ win: demo?.teams[1].score > demo?.teams[0].score }" x-text="demo?.teams[1].score"></b>
          <span class="tn" x-text="demo?.teams[1].name"></span>
        </div>
      </div>
    </header>

    <div class="section-title">
      <h2 x-text="t('pickTitle')"></h2>
      <p x-text="player ? t('playerPicked') : t('pickPlayer')"></p>
    </div>
    <div class="teams">
      <template x-for="(team, ti) in demo?.teams || []" :key="ti">
        <div class="card team-card">
          <header>
            <h3 x-text="team.name || t('others')"></h3>
            <span class="badge" :data-variant="ti === winnerIndex ? 'primary' : 'secondary'" x-show="team.score != null" x-text="team.score"></span>
          </header>
          <section>
            <table class="table">
              <thead><tr><th x-text="t('playerCol')"></th><th>K</th><th>D</th><th>A</th><th>ADR</th><th>HS%</th></tr></thead>
              <tbody>
                <template x-for="p in team.players" :key="p.steamid">
                  <tr :class="{ on: player && player.steamid === p.steamid }" @click="pickPlayer(p)"
                      tabindex="0" @keydown.enter="pickPlayer(p)" @keydown.space.prevent="pickPlayer(p)">
                    <td class="pname"><span class="radio-dot"></span><span x-text="p.name"></span></td>
                    <td x-text="p.k ?? '–'"></td><td x-text="p.d ?? '–'"></td><td x-text="p.a ?? '–'"></td>
                    <td x-text="p.adr ?? '–'"></td><td x-text="p.hs == null ? '–' : p.hs + '%'"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </section>
        </div>
      </template>
    </div>

    <div class="card rounds-card" x-show="player">
      <header>
        <h3 x-text="t('roundsTitle')"></h3>
        <p x-text="t('roundsHelp')"></p>
        <div class="card-action">
          <span class="rounds-count" x-text="chosenRounds.length + ' / ' + (demo?.rounds || 0)"></span>
          <button class="btn" data-variant="outline" data-size="xs" @click="allRounds()" x-text="t('all')"></button>
          <button class="btn" data-variant="ghost" data-size="xs" @click="noRounds()" x-text="t('none')"></button>
        </div>
      </header>
      <section>
        <div class="strip" role="group" :aria-label="t('roundsTitle')">
          <template x-for="r in roundList" :key="r">
            <button class="rt" :class="{ on: chosenRounds.includes(r), died: player?.rounds_died?.[r - 1] }"
                    @click="toggleRound(r)" :aria-pressed="chosenRounds.includes(r)" :title="roundTitle(r)">
              <span class="rn" x-text="r"></span>
              <span class="pips"><template x-for="k in Math.min(player?.rounds_k?.[r - 1] || 0, 5)"><i></i></template></span>
            </button>
          </template>
        </div>
        <p class="legend">
          <span><i class="pip"></i><span x-text="t('legendKill')"></span></span>
          <span><i class="deadmark"></i><span x-text="t('legendDied')"></span></span>
          <span><i class="sel"></i><span x-text="t('legendPicked')"></span></span>
        </p>
      </section>
    </div>

    <div class="card opts-card" x-show="player">
      <header><h3 x-text="t('optsTitle')"></h3></header>
      <section class="opts">
        <label class="opt"><input type="checkbox" role="switch" class="input" x-model="prefs.intro" @change="savePrefs()"><span><b x-text="t('optIntro')"></b><em x-text="t('optIntroHelp')"></em></span></label>
        <label class="opt"><input type="checkbox" role="switch" class="input" x-model="prefs.minimap" @change="savePrefs()"><span><b x-text="t('optMinimap')"></b><em x-text="t('optMinimapHelp')"></em></span></label>
        <label class="opt"><input type="checkbox" role="switch" class="input" x-model="prefs.keyboard" @change="savePrefs()"><span><b x-text="t('optKeyboard')"></b><em x-text="t('optKeyboardHelp')"></em></span></label>
        <label class="opt"><input type="checkbox" role="switch" class="input" x-model="prefs.show_enemies" @change="savePrefs()"><span><b x-text="t('optEnemies')"></b><em x-text="t('optEnemiesHelp')"></em></span></label>
        <label class="opt"><input type="checkbox" role="switch" class="input" x-model="prefs.highlights" @change="savePrefs()"><span><b x-text="t('optHighlights')"></b><em x-text="t('optHighlightsHelp')"></em></span></label>
        <label class="opt"><input type="checkbox" role="switch" class="input" x-model="prefs.upload" @change="savePrefs()"><span><b x-text="t('optUpload')"></b><em x-text="t('optUploadHelp')"></em></span></label>
      </section>
      <footer>
        <button class="btn" data-variant="ghost" data-size="sm" @click="chooseFolder('output')" :title="prefs.output">
          <svg><use href="#i-folder"/></svg><span x-text="t('saveTo') + ' ' + shortPath(prefs.output)"></span>
        </button>
      </footer>
    </div>

    <div class="action-bar" x-show="player">
      <div class="who">
        <span class="avatar-ic"><svg><use href="#i-crosshair"/></svg></span>
        <div>
          <b x-text="player?.name"></b>
          <span x-text="demo?.map_pretty + ' · ' + (chosenRounds.length === demo?.rounds ? t('wholeMatch') : t('nRounds', { n: chosenRounds.length }))"></span>
        </div>
      </div>
      <p class="why-not" x-show="!canStart" x-text="whyNot"></p>
      <div class="go">
        <button class="btn" data-variant="outline" data-size="lg" x-show="job.state !== 'running'" @click="start(false)" :disabled="!canStart">
          <svg><use href="#i-list-plus"/></svg><span x-text="t('addQueue')"></span>
        </button>
        <button class="btn" data-size="lg" @click="start(true)" :disabled="!canStart">
          <svg x-show="job.state !== 'running'"><use href="#i-video"/></svg>
          <svg x-show="job.state === 'running'"><use href="#i-list-plus"/></svg>
          <span x-text="t(job.state === 'running' ? 'queueIt' : 'recordShort', { name: player?.name })"></span>
        </button>
      </div>
    </div>
  </section>

  <!-- recording / finished / failed -->
  <section class="page run" x-show="runVisible">
    <header class="page-head">
      <div class="run-title">
        <h1 x-text="runTitle"></h1>
        <span class="badge" :data-variant="{ running: 'primary', done: 'secondary', error: 'destructive', cancelled: 'outline' }[res.state] || 'outline'" x-text="t('st_' + res.state)"></span>
      </div>
      <p x-text="runSub"></p>
    </header>

    <div class="card progress-card" x-show="!viewingItem && job.state === 'running'">
      <section>
        <div class="pc-top">
          <b x-text="t('stage_' + (job.stage || 'read'))"></b>
          <span class="pc-num"><span x-text="progressPct + '%'"></span><span class="elapsed" x-text="clock(job.elapsed)"></span></span>
        </div>
        <div class="progress" role="progressbar" :aria-valuenow="progressPct" aria-valuemin="0" aria-valuemax="100"><span :style="'width:' + progressPct + '%'"></span></div>
        <ol class="stages">
          <template x-for="(s, i) in stages" :key="s">
            <li :class="stageClass(s)">
              <span class="st-ic">
                <svg x-show="stageClass(s) === 'done'"><use href="#i-check"/></svg>
                <svg class="spin" x-show="stageClass(s) === 'now'"><use href="#i-loader-circle"/></svg>
                <b x-show="stageClass(s) === 'todo'" x-text="i + 1"></b>
                <svg x-show="stageClass(s) === 'fail'"><use href="#i-x"/></svg>
              </span>
              <span x-text="t('stage_' + s)"></span>
              <em x-show="stageClass(s) === 'now' && job.step[1]" x-text="job.step[0] + ' / ' + job.step[1]"></em>
            </li>
          </template>
        </ol>
        <div class="strip run-strip">
          <template x-for="r in runRounds" :key="r">
            <span class="rt" :class="{ on: roundDone(r) }"><span class="rn" x-text="r"></span></span>
          </template>
        </div>
      </section>
      <footer>
        <p class="keep"><svg><use href="#i-info"/></svg><span x-text="t('keep')"></span></p>
        <button class="btn" data-variant="destructive" data-size="sm" @click="cancel()"><svg><use href="#i-square"/></svg><span x-text="t('stop')"></span></button>
      </footer>
    </div>

    <div class="result" x-show="res.state === 'done'">
      <div class="cover-wrap">
        <template x-if="res.result"><img class="cover" :src="'/api/thumb?path=' + encodeURIComponent(thumbOf(res))" alt="" x-on:error="$el.remove()"></template>
      </div>
      <div class="result-side">
        <div class="btn-col">
          <button class="btn" data-size="lg" @click="openPath(res.result)"><svg><use href="#i-play"/></svg><span x-text="t('play')"></span></button>
          <button class="btn" data-variant="secondary" data-size="lg" x-show="res.highlights" @click="openPath(res.highlights)"><svg><use href="#i-sparkles"/></svg><span x-text="t('playHighlights')"></span></button>
          <button class="btn" data-variant="outline" data-size="lg" @click="openPath(res.result, true)"><svg><use href="#i-folder-open"/></svg><span x-text="t('showFolder')"></span></button>
        </div>
        <div class="card upload" x-show="res.title">
          <header><h3 x-text="t('titleLabel')"></h3></header>
          <section><p class="up-title" x-text="res.title"></p></section>
          <footer>
            <button class="btn" data-variant="secondary" data-size="sm" @click="copy(res.title)"><svg><use href="#i-copy"/></svg><span x-text="t('copy')"></span></button>
            <button class="btn" data-variant="ghost" data-size="sm" @click="openPath(res.description)"><svg><use href="#i-file-text"/></svg><span x-text="t('openDesc')"></span></button>
          </footer>
        </div>
        <button class="btn" data-variant="ghost" @click="again()"><span x-text="t('another')"></span></button>
      </div>
    </div>

    <div class="alert failure" data-variant="destructive" x-show="res.state === 'error' || res.state === 'cancelled'">
      <svg><use href="#i-circle-alert"/></svg>
      <h2 x-text="res.state === 'cancelled' ? t('cancelled') : t('failed')"></h2>
      <section>
        <p x-show="res.state === 'error'" x-text="res.error"></p>
        <p x-show="res.state === 'error'" x-text="t('retryHint')"></p>
        <div class="fail-actions">
          <button class="btn" data-size="sm" @click="retry()"><svg><use href="#i-refresh-cw"/></svg><span x-text="t('retry')"></span></button>
          <button class="btn" data-variant="outline" data-size="sm" @click="again()"><span x-text="t('back')"></span></button>
        </div>
      </section>
    </div>

    <details class="log" x-show="!viewingItem && job.lines.length">
      <summary x-text="t('details')"></summary>
      <pre x-ref="log" x-text="job.lines.join('\n')"></pre>
    </details>
  </section>
</main>

<div class="toasts" aria-live="polite">
  <template x-for="m in toasts" :key="m.id">
    <div class="toast-msg"><svg><use href="#i-circle-check"/></svg><span x-text="m.text"></span></div>
  </template>
</div>
