name: Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as a release with this tag (e.g. v0.7.0); leave empty to only build"
        required: false
        default: ""
      refresh_ffmpeg:
        description: "Take a new FFmpeg build from BtbN instead of the kept one"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pytest

      - name: Tests
        run: python -m pytest -q

      - name: Build
        working-directory: packaging
        run: pyinstaller --noconfirm povforge.spec

      # FFmpeg ships inside the app (unmodified BtbN GPL shared build), with its licence
      # and a note on where the matching source is. The same files are reused from build
      # to build (kept as the "ffmpeg-bundle" pre-release), so in-app updates don't fetch
      # FFmpeg again; BtbN's daily build changes every day. refresh_ffmpeg takes a new one.
      - name: Bundle FFmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH: ${{ inputs.refresh_ffmpeg }}
          RELEASING: ${{ inputs.release }}
        run: |
          $dest = "packaging/dist/PovForge/ffmpeg"
          New-Item -ItemType Directory -Force $dest | Out-Null
          $repo = "${{ github.repository }}"
          $got = $false
          if ($env:REFRESH -ne "true") {
            gh release download ffmpeg-bundle --repo $repo --pattern ffmpeg-bundle.zip --dir ffb 2>$null
            if (Test-Path ffb/ffmpeg-bundle.zip) {
              Expand-Archive ffb/ffmpeg-bundle.zip -DestinationPath $dest -Force
              Write-Host "FFmpeg: the kept bundle"; $got = $true
            }
          }
          if (-not $got -and $env:REFRESH -ne "true") {
            # first time: the FFmpeg of the latest PovForge release, so updates from it stay small
            gh release download --repo $repo --pattern PovForge-windows.zip --dir prev 2>$null
            if (Test-Path prev/PovForge-windows.zip) {
              Expand-Archive prev/PovForge-windows.zip -DestinationPath prev/x
              if (Test-Path prev/x/PovForge/ffmpeg/ffmpeg.exe) {
                Copy-Item prev/x/PovForge/ffmpeg/* $dest -Recurse -Force
                Write-Host "FFmpeg: taken from the latest release"; $got = $true
              }
            }
          }
          if (-not $got) {
            $base = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
            $names = @("ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip", "ffmpeg-master-latest-win64-gpl-shared.zip")
            $name = $null
            foreach ($n in $names) {
              try { Invoke-WebRequest "$base/$n" -OutFile ffmpeg.zip -UseBasicParsing; $name = $n; break } catch { Write-Host "not found: $n" }
            }
            if (-not $name) { throw "no FFmpeg build found" }
            Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src
            $top = (Get-ChildItem ffmpeg-src -Directory)[0].FullName
            Copy-Item "$top/bin/*" $dest -Exclude ffplay.exe
            Copy-Item "$top/LICENSE.txt" "$dest/LICENSE.txt"
            $ver = (& "$dest/ffmpeg.exe" -hide_banner -version | Select-Object -First 1)
            $hash = if ($ver -match "-g([0-9a-f]{7,})") { $Matches[1] } else { "" }
            @(
              "FFmpeg in this folder is an unmodified build from BtbN/FFmpeg-Builds ($name),",
              "licensed under the GNU GPL version 3 (see LICENSE.txt). PovForge runs it as a separate program.",
              "",
              "Version: $ver",
              "FFmpeg source: https://git.ffmpeg.org/gitweb/ffmpeg.git/commit/$hash  (also https://github.com/FFmpeg/FFmpeg/commit/$hash)",
              "Build scripts and the sources of the bundled libraries: https://github.com/BtbN/FFmpeg-Builds",
              "If you cannot get the source from those links, open an issue at https://github.com/Chester-chs/CS2-povforge/issues and we will provide it."
            ) | Set-Content "$dest/SOURCE.txt" -Encoding utf8
            Write-Host "FFmpeg: new BtbN build"
          }
          Remove-Item "$dest/ffplay.exe" -ErrorAction SilentlyContinue
          $ver = (& "$dest/ffmpeg.exe" -hide_banner -version | Select-Object -First 1)
          if (-not ($ver -match "ffmpeg version")) { throw "bundled ffmpeg does not run" }
          $enc = (& "$dest/ffmpeg.exe" -hide_banner -encoders | Select-String libx264)
          if (-not $enc) { throw "bundled ffmpeg has no libx264" }
          if (-not (Test-Path "$dest/LICENSE.txt") -or -not (Test-Path "$dest/SOURCE.txt")) { throw "FFmpeg licence or source note missing" }
          Get-Content "$dest/SOURCE.txt"
          Get-ChildItem $dest | Format-Table Name, Length
          # keep these exact files for the next builds (when publishing)
          $kept = (gh release view ffmpeg-bundle --repo $repo --json tagName 2>$null)
          if ($env:RELEASING -and (-not $kept -or $env:REFRESH -eq "true")) {
            Compress-Archive -Path "$dest/*" -DestinationPath ffmpeg-bundle.zip -Force
            if ($kept) { gh release delete ffmpeg-bundle --repo $repo --yes --cleanup-tag }
            $notes = "The FFmpeg that PovForge ships in its installer, kept so every build uses the same files (in-app updates then don't download FFmpeg again). Not a PovForge release. Unmodified build from BtbN/FFmpeg-Builds, GPL v3; LICENSE.txt and SOURCE.txt (where the matching source is) are in the zip.`n`nPovForge 安装包自带的 FFmpeg，保存在这里让每次构建用相同的文件（软件内更新就不用重复下载 FFmpeg）。这不是 PovForge 的版本发布。"
            gh release create ffmpeg-bundle ffmpeg-bundle.zip --repo $repo --target "${{ github.sha }}" --prerelease --title "FFmpeg bundled with PovForge" --notes $notes
          }
          exit 0

      - name: Smoke test
        shell: pwsh
        run: |
          $dir = "packaging/dist/PovForge"
          $doc = (& "$dir/povforge-cli.exe" doctor | Out-String)
          Write-Host $doc
          if (-not ($doc -match "OK  \] demoparser2")) { throw "demoparser2 can't load its tables (polars/pyarrow missing from the build)" }
          if (-not ($doc -match "PovForge[\\/]ffmpeg[\\/]ffmpeg\.exe")) { throw "the app does not use its bundled FFmpeg" }
          & "$dir/povforge-cli.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "povforge-cli.exe --help failed" }
          & "$dir/povforge-cli.exe" doctor
          if (-not (Test-Path "$dir/PovForge.exe")) { throw "PovForge.exe missing" }
          $server = Start-Process "$dir/povforge-cli.exe" -ArgumentList "gui","--port","8765","--no-window" -PassThru
          Start-Sleep -Seconds 8
          $state = Invoke-RestMethod "http://127.0.0.1:8765/api/state"
          if (-not $state.version) { throw "app server did not answer" }
          $page = Invoke-WebRequest "http://127.0.0.1:8765/" -UseBasicParsing
          if ($page.Content -notmatch "PovForge") { throw "app page missing" }
          Write-Host "App server OK, version $($state.version)"
          Stop-Process -Id $server.Id -Force

      # manifest.json: every file's size and SHA-256. The app compares it with a new
      # release's to download only the files that changed.
      - name: File list
        shell: pwsh
        run: |
          & packaging/dist/PovForge/povforge-cli.exe self-update --app packaging/dist/PovForge --manifest
          if ($LASTEXITCODE -ne 0) { throw "manifest failed" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path packaging/dist/PovForge -DestinationPath PovForge-windows.zip

      - name: Installer
        shell: pwsh
        run: |
          $v = (Select-String -Path povforge/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $ver = if (Test-Path $iscc) { (Get-Item $iscc).VersionInfo.ProductVersion } else { "" }
          if (-not $ver -or [version]($ver -replace '[^0-9.].*$', '') -lt [version]"6.5") {
            choco upgrade innosetup -y --no-progress
          }
          & $iscc /Qp "/DAppVersion=$v" packaging/povforge.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Copy-Item packaging/dist/PovForge-Setup.exe PovForge-Setup.exe

      - name: Installer test
        shell: pwsh
        run: |
          $p = Start-Process ./PovForge-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed: $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\PovForge\PovForge.exe"
          if (-not (Test-Path $app)) { throw "PovForge.exe was not installed" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\PovForge\povforge-cli.exe")) { throw "povforge-cli.exe missing" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\PovForge\ffmpeg\ffmpeg.exe")) { throw "bundled FFmpeg missing" }
          $desk = [Environment]::GetFolderPath("Desktop")
          if (-not (Test-Path "$desk\PovForge.lnk")) { throw "no desktop shortcut" }
          $menu = [Environment]::GetFolderPath("Programs")
          if (-not (Test-Path "$menu\PovForge.lnk")) { throw "no Start menu entry" }
          Write-Host "Installed OK: $app, desktop and Start menu shortcuts"
          $dir = Split-Path $app
          if (-not (Test-Path "$dir\manifest.json")) { throw "manifest.json missing" }
          # incremental update: make the install look older (a changed file, a file the new
          # version dropped, no file list), then let the update fix it from the release zip
          $css = Get-ChildItem $dir -Recurse -Filter app.css | Select-Object -First 1
          Add-Content $css.FullName "/* older version */"
          Remove-Item "$dir\manifest.json"
          Set-Content "$dir\left-from-old-version.txt" "x"
          & packaging/dist/PovForge/povforge-cli.exe self-update --app $dir --zip PovForge-windows.zip --current 0.0.0 --log "$env:TEMP\pf-update.log"
          $code = $LASTEXITCODE
          if (Test-Path "$env:TEMP\pf-update.log") { Get-Content "$env:TEMP\pf-update.log" }
          if ($code -ne 0) { throw "incremental update failed" }
          if (Test-Path "$dir\left-from-old-version.txt") { throw "incremental update left an old file" }
          if (-not (Test-Path "$dir\manifest.json")) { throw "incremental update did not write the file list" }
          Write-Host "Incremental update OK"
          # in-app update path: install over the top quietly, the new app must open by itself
          # (no -Wait: it would also wait for the PovForge the installer opens, which keeps running)
          $p = Start-Process ./PovForge-Setup.exe -ArgumentList "/SILENT","/SUPPRESSMSGBOXES","/NORESTART","/update=1" -PassThru
          if (-not $p.WaitForExit(300000)) { throw "update install timed out" }
          if ($p.ExitCode -ne 0) { throw "update install failed: $($p.ExitCode)" }
          $opened = $null
          for ($i = 0; $i -lt 20 -and -not $opened; $i++) { Start-Sleep 1; $opened = Get-Process PovForge -ErrorAction SilentlyContinue }
          if (-not $opened) { throw "PovForge did not reopen after the update install" }
          Write-Host "Update install reopened PovForge (pid $($opened.Id))"
          $nativeReady = $false
          for ($i = 0; $i -lt 30 -and -not $nativeReady; $i++) {
            Start-Sleep 1
            $nativeReady = [bool](Select-String -Path "$env:LOCALAPPDATA/povforge/app.log" -Pattern 'Native WebView2 ready' -Quiet -ErrorAction SilentlyContinue)
          }
          if (-not $nativeReady) { throw "Installed app did not load the native WebView2 window" }
          Write-Host "Native WebView2 window loaded successfully"
          Get-Process PovForge, msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          Start-Process "$env:LOCALAPPDATA\Programs\PovForge\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $app); $i++) { Start-Sleep 1 }
          if (Test-Path $app) { throw "uninstall left the app behind" }
          if (Test-Path "$desk\PovForge.lnk") { throw "uninstall left the desktop shortcut" }
          Write-Host "Uninstalled OK"

      - uses: actions/upload-artifact@v4
        with:
          name: PovForge-windows
          path: |
            PovForge-Setup.exe
            PovForge-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        shell: pwsh
        run: gh release create "$env:TAG" PovForge-Setup.exe PovForge-windows.zip --target "${{ github.sha }}" --title "PovForge $env:TAG" --notes-file packaging/RELEASE_NOTES.md
